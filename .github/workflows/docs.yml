name: Docs

# Checks the generated parts of the docs and builds the site on every pull
# request; deploys it to GitHub Pages on every push to develop.
on:
  pull_request:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: docs-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Check screenshots and CLI samples
        # Same command as `mise run docs:screenshots:check`: renders the TUI
        # screenshots, their goldens and the CLI samples from the demo state
        # into a temporary directory and fails when the committed files are
        # stale. The SVGs are text, so they compare exactly on any platform.
        run: scripts/docs-check.sh screenshots

      - name: Check command reference
        # Same command as `mise run docs:reference:check`.
        run: scripts/docs-check.sh reference

      - name: Install docs toolchain
        run: uv sync --locked

      - name: Build docs (strict)
        # Same command as `mise run docs:build`.
        run: uv run --locked zensical build --clean --strict

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # One deployment at a time; a running deploy is never cancelled.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
