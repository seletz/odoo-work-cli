name: Release

# Tag v*: verify (tests, lint, changelog, docs) -> GoReleaser -> deploy the docs site.
# Nothing is released when the verification fails; the site is deployed only
# after the release is out, so it always shows the state of the latest release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Changelog has a section for the tag
        # scripts/release.sh cuts [Unreleased] into the section of the new
        # version before tagging; a tag without one has no release notes.
        run: go run ./tools/changelog section "$GITHUB_REF_NAME" > /dev/null

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

      - name: Check screenshots and CLI samples
        run: scripts/docs-check.sh screenshots

      - name: Check command reference and man pages
        # The man pages are packaged by GoReleaser; this fails when they are stale.
        run: scripts/docs-check.sh reference

      - name: Install docs toolchain
        run: uv sync --locked

      - name: Build docs (strict)
        env:
          DOCS_VERSION: ${{ github.ref_name }}
        run: uv run --locked zensical build --clean --strict

      - name: Check the version on the site
        run: scripts/docs-version-check.sh "$GITHUB_REF_NAME"

  goreleaser:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Release notes from the changelog
        # The section of the tag is the head of the release text; GoReleaser
        # appends its commit list below it (--release-header, not
        # --release-notes: that would skip the commit list).
        run: go run ./tools/changelog section "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --release-header ${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

  docs:
    needs: goreleaser
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # One deployment at a time; a running deploy is never cancelled.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install docs toolchain
        run: uv sync --locked

      - name: Build docs (strict)
        env:
          DOCS_VERSION: ${{ github.ref_name }}
        run: uv run --locked zensical build --clean --strict

      - name: Check the version on the site
        run: scripts/docs-version-check.sh "$GITHUB_REF_NAME"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
