[tools]
go = "latest"
op = "latest"
"go:github.com/golangci/golangci-lint/v2/cmd/golangci-lint" = "latest"
gh = "latest"
goreleaser = "latest"
uv = "latest"

[env]
# Dev-environment credentials, generated from 1p.env via `mise run prepare_env`.
_.file = ".env"

[task_config]
# File tasks: scripts/tasks/odoo/<name> becomes task "odoo:<name>".
includes = ["scripts/tasks"]

[tasks.build]
description = "Build the CLI binary"
run = """
VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
go build -ldflags "-X github.com/seletz/odoo-work-cli/internal/version.Version=${VERSION}" -o odoo-work-cli ./cmd/odoo-work-cli
"""

[tasks.release]
description = "Create a new release (interactive semver bump)"
run = "scripts/release.sh"

[tasks.run]
description = "Build and run the CLI (pass args after --)"
depends = ["build"]
usage = 'arg "[args]" var=#true'
run = "./odoo-work-cli"

[tasks.prepare_env]
description = "Generate .env from 1Password (op inject on 1p.env)"
run = """
op inject -f -i 1p.env -o .env
chmod 600 .env
echo ".env written from 1p.env"
"""

[tasks."odoo:prepare-db"]
description = "Bootstrap the dev database: create API key, refresh .env, add test data"
# Each step is a fresh `mise run` so it picks up the .env the previous step wrote.
run = [
    "mise run odoo:create-api-key",
    "mise run prepare_env",
    "mise run odoo:add-test-data",
    "mise run odoo:ensure-test-user",
]

[tasks."odoo:login-canary"]
description = "Version-drift canary: exercise the full web-login flow (login + TOTP + session call) against dev — run BEFORE any Odoo upgrade reaches test/prod"
# -count=1: a canary must never report a cached pass.
run = "go test -tags devverify -count=1 -run TestDevVerify_LoginFlowCanary -v ./internal/odoo/"

[tasks.test]
description = "Run all tests"
run = "go test ./..."

[tasks.lint]
description = "Run golangci-lint"
run = "golangci-lint run ./..."

[tasks.fmt]
description = "Format Go code"
run = "gofmt -w ."

[tasks.goreleaser-check]
description = "Validate GoReleaser config"
run = "goreleaser check"

[tasks.goreleaser-snapshot]
description = "Test GoReleaser build locally (no publish)"
run = "goreleaser release --snapshot --clean"

[tasks."uv:sync"]
description = "Install the docs toolchain (Zensical) into .venv"
run = "uv sync --locked"

[tasks."docs:serve"]
description = "Serve the documentation locally with live reload"
depends = ["uv:sync"]
run = "uv run --locked zensical serve --open"

[tasks."docs:build"]
description = "Build the documentation site (strict) into site/"
depends = ["uv:sync"]
run = "uv run --locked zensical build --clean --strict"

[tasks."docs:screenshots"]
description = "Render the TUI screenshots, their text goldens, the CLI output samples and the demo state from the fake backend (fixed clock)"
run = "go run ./tools/docsgen screenshots"

[tasks."docs:screenshots:check"]
description = "Fail when the committed screenshots, goldens or CLI samples differ from a fresh render (CI runs this)"
run = "scripts/docs-check.sh screenshots"

[tasks."docs:reference"]
description = "Generate the command reference (docs/reference/commands) from the cobra command tree"
run = "go run ./tools/docsgen reference"

[tasks."docs:reference:check"]
description = "Fail when the committed command reference differs from the code (CI runs this)"
run = "scripts/docs-check.sh reference"

[tasks."docs:mcp"]
description = "Generate the MCP tool reference (docs/reference/60-mcp-tools.md) from the tool table"
run = "go run ./tools/docsgen mcp"

[tasks."docs:mcp:check"]
description = "Check the MCP tool reference is up to date"
run = "go test ./internal/cli -run TestMCPToolsReferenceUpToDate -count=1"

[tasks."docs:generate"]
description = "Regenerate everything generated in docs/"
depends = ["docs:screenshots", "docs:reference", "docs:mcp"]

[tasks."docs:check"]
description = "Check everything generated in docs/ is up to date"
depends = ["docs:screenshots:check", "docs:reference:check", "docs:mcp:check"]
