version: 2

project_name: odoo-work-cli

before:
  hooks:
    - go mod tidy
    - ./scripts/completions.sh

builds:
  - id: odoo-work-cli
    main: ./cmd/odoo-work-cli
    binary: odoo-work-cli
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/seletz/odoo-work-cli/internal/version.Version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}-{{ .Tag }}-{{ .Os }}-{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - completions/*

checksum:
  name_template: "checksums-{{ .Tag }}.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  prerelease: auto

homebrew_casks:
  - name: odoo-work-cli
    binaries:
      - odoo-work-cli
    repository:
      owner: seletz
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "Update {{ .ProjectName }} to {{ .Tag }}"
    directory: Casks
    homepage: "https://github.com/seletz/odoo-work-cli"
    description: "CLI tool for managing Odoo 17 timesheets"
    license: "MIT"
    completions:
      bash: completions/odoo-work-cli.bash
      zsh: completions/_odoo-work-cli
      fish: completions/odoo-work-cli.fish
    # Strip the macOS quarantine attribute so the unsigned binary runs without a
    # Gatekeeper prompt. Homebrew 7 deprecated the Ruby `postflight do` block in
    # favour of the declarative `postflight_steps` stanza, but GoReleaser (as of
    # 2.18) still renders `hooks.post.install` as `postflight do`, so the stanza
    # is emitted via `custom_block` instead (#68). `{{staged_path}}` is a
    # Homebrew install-time token; GoReleaser runs the rendered cask through Go
    # templates, so the braces are escaped to reach Homebrew verbatim.
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{" }}staged_path{{ "}}" }}/odoo-work-cli"]
        end
      end
